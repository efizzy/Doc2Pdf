[package]
name = "efizzy-layout"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Efizzy layout: shaping, line breaking, tabs, lists, tables, pagination, headers/footers, hit testing"

[lints]
workspace = true

[dependencies]
efizzy-geom = { workspace = true }
efizzy-doc = { workspace = true }
efizzy-fonts = { workspace = true }
efizzy-proof = { workspace = true }
efizzy-metafile = { workspace = true }
kurbo = { workspace = true }
unicode-bidi = { workspace = true }
unicode-linebreak = { workspace = true }
unicode-segmentation = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true }
log = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# The browser clock (`SystemTime::now()`/`Instant::now()` panic on wasm32-unknown-unknown).
js-sys = "0.3"
