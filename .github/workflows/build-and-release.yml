name: Build & Release Cross-Platform Efizzy.Doc2Pdf

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # =========================================================================
  # 1. Build Native Binaries on Windows
  # =========================================================================
  build-native-windows:
    name: Native Windows (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            rid: win-x64
            artifact: doc2pdf_native.dll
          - target: aarch64-pc-windows-msvc
            rid: win-arm64
            artifact: doc2pdf_native.dll
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Native Release (${{ matrix.target }})
        shell: pwsh
        run: |
          cd src/native/core
          cargo build --release -p doc2pdf_native --target ${{ matrix.target }}

      - name: Stage Artifact
        shell: pwsh
        run: |
          $src = "src/native/core/target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          $dest = "staging/${{ matrix.rid }}/${{ matrix.artifact }}"
          New-Item -ItemType Directory -Force (Split-Path $dest) | Out-Null
          Copy-Item $src $dest -Force

      - name: Upload Native Binary
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: staging/${{ matrix.rid }}/${{ matrix.artifact }}

  # =========================================================================
  # 2. Build Native Binaries on Linux
  # =========================================================================
  build-native-linux:
    name: Native Linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            rid: linux-x64
            artifact: libdoc2pdf_native.so
          - target: aarch64-unknown-linux-gnu
            rid: linux-arm64
            artifact: libdoc2pdf_native.so
          - target: x86_64-unknown-linux-musl
            rid: linux-musl-x64
            artifact: libdoc2pdf_native.so
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross for cross-compilation
        run: |
          cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Native Release with Cross (${{ matrix.target }})
        run: |
          cd src/native/core
          cross build --release -p doc2pdf_native --target ${{ matrix.target }}

      - name: Stage Artifact
        run: |
          mkdir -p staging/${{ matrix.rid }}
          cp src/native/core/target/${{ matrix.target }}/release/${{ matrix.artifact }} staging/${{ matrix.rid }}/

      - name: Upload Native Binary
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: staging/${{ matrix.rid }}/${{ matrix.artifact }}

  # =========================================================================
  # 3. Build Native Binaries on macOS
  # =========================================================================
  build-native-macos:
    name: Native macOS (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            rid: osx-arm64
            artifact: libdoc2pdf_native.dylib
          - target: x86_64-apple-darwin
            rid: osx-x64
            artifact: libdoc2pdf_native.dylib
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Native Release (${{ matrix.target }})
        run: |
          cd src/native/core
          cargo build --release -p doc2pdf_native --target ${{ matrix.target }}

      - name: Stage Artifact
        run: |
          mkdir -p staging/${{ matrix.rid }}
          cp src/native/core/target/${{ matrix.target }}/release/${{ matrix.artifact }} staging/${{ matrix.rid }}/

      - name: Upload Native Binary
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: staging/${{ matrix.rid }}/${{ matrix.artifact }}

  # =========================================================================
  # 4. Assemble Multi-Platform NuGet Package & Test
  # =========================================================================
  package-and-test:
    name: Pack & Cross-Platform Verification
    needs: [build-native-windows, build-native-linux, build-native-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # Download all platform binaries
      - uses: actions/download-artifact@v4
        with:
          name: native-win-x64
          path: src/Efizzy.Doc2Pdf/runtimes/win-x64/native/
      - uses: actions/download-artifact@v4
        with:
          name: native-win-arm64
          path: src/Efizzy.Doc2Pdf/runtimes/win-arm64/native/
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: src/Efizzy.Doc2Pdf/runtimes/linux-x64/native/
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-arm64
          path: src/Efizzy.Doc2Pdf/runtimes/linux-arm64/native/
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-musl-x64
          path: src/Efizzy.Doc2Pdf/runtimes/linux-musl-x64/native/
      - uses: actions/download-artifact@v4
        with:
          name: native-osx-arm64
          path: src/Efizzy.Doc2Pdf/runtimes/osx-arm64/native/
      - uses: actions/download-artifact@v4
        with:
          name: native-osx-x64
          path: src/Efizzy.Doc2Pdf/runtimes/osx-x64/native/

      - name: Verify Runtimes Directory Tree
        run: |
          ls -laR src/Efizzy.Doc2Pdf/runtimes/

      - name: Run .NET Unit Tests on Linux
        run: |
          dotnet test tests/Efizzy.Doc2Pdf.Tests/Efizzy.Doc2Pdf.Tests.csproj -c Release

      - name: Pack Unified Cross-Platform NuGet Package
        run: |
          dotnet pack src/Efizzy.Doc2Pdf/Efizzy.Doc2Pdf.csproj -c Release -o artifacts/

      - name: Upload Final NuGet Packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg

      - name: Release to GitHub (On Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
